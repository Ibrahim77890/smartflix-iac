repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_tfsec
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.329
    hooks:
      - id: checkov
        args:
          - --framework
          - terraform
